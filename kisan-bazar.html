<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--

  policy). A meta-tag CSP is weaker than a server-sent header — it can't

  the HTML has already started parsing — so this is a floor, not a
  substitute for header-based CSP at whatever serves this file in
  production. 'unsafe-inline' on script-src is required because the app
  ships as one inline script block by design (a single-file artifact);
  tightening that would mean moving to an external script with a nonce

-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>किसान बजार — Kisan Bazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paddy:#17583C;
  --paddy-deep:#0E3826;
  --tori:#E9B008;
  --tori-soft:#FBEDBE;
  --soil:#7A4A24;
  --alert:#BE3218;
  --alert-soft:#FBE3DD;
  --ink:#16211B;
  --ink-2:#4A5851;
  --ink-3:#7E8C85;
  --paper:#EFF2EA;
  --card:#FFFFFF;
  --line:#D8DFD3;
  --radius-lg:18px;
  --radius-sm:9px;
  --shell:430px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EFE9; --ink-2:#A7B6AD; --ink-3:#7C8B82;
    --paper:#10150F; --card:#1A211B; --line:#2C3830;
    --tori-soft:#3A2F08; --alert-soft:#3A180F;
    --paddy:#3E9D6E; --paddy-deep:#0B2A1C;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EFE9; --ink-2:#A7B6AD; --ink-3:#7C8B82;
  --paper:#10150F; --card:#1A211B; --line:#2C3830;
  --tori-soft:#3A2F08; --alert-soft:#3A180F;
  --paddy:#3E9D6E; --paddy-deep:#0B2A1C;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Mukta",system-ui,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5;
  display:flex; justify-content:center;
  min-height:100vh;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid var(--tori); outline-offset:2px; border-radius:4px;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{
  width:100%; max-width:var(--shell); background:var(--paper);
  min-height:100vh; display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 0 1px var(--line);
}
@media(min-width:900px){ .shell{min-height:100vh} }

/* ---------- top bar ---------- */
.top{
  background:var(--paddy-deep); color:#F2F7F0; padding:14px 18px 0;
  position:relative; overflow:hidden; flex:0 0 auto;
}
.top .terrace{position:absolute;inset:auto 0 -2px 0;height:26px;width:100%;opacity:.5}
.top-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand{font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-weight:200;font-size:12px;opacity:.7;letter-spacing:.06em}
.top-actions{margin-left:auto;display:flex;gap:6px}
.chipbtn{
  border:1px solid rgba(255,255,255,.28); border-radius:99px;
  padding:5px 11px; font-size:13px; font-weight:600; color:#F2F7F0;
}
.chipbtn[aria-pressed="true"]{background:var(--tori);border-color:var(--tori);color:#241C00}

.roles{display:flex;gap:6px;position:relative;z-index:1;padding:12px 0 18px}
.role{
  flex:1; text-align:center; padding:7px 4px; border-radius:99px; font-size:14px;
  font-weight:600; color:rgba(242,247,240,.72); border:1px solid rgba(255,255,255,.18);
}
.role[aria-selected="true"]{background:#F2F7F0;color:var(--paddy-deep);border-color:#F2F7F0}

/* ---------- content ---------- */
.main{flex:1 1 auto;padding:16px 16px 100px;overflow-x:hidden}
.stack>*+*{margin-top:14px}

h2.sec{font-size:15px;font-weight:600;color:var(--ink-2);margin:22px 0 10px}
h2.sec:first-child{margin-top:4px}

.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:16px;
}
.card.flat{border-radius:var(--radius-sm)}

/* ---------- weather band: the hero ---------- */
.warn{
  border-radius:var(--radius-lg); padding:18px 18px 16px;
  background:var(--alert-soft); border-left:7px solid var(--alert);
  position:relative;
}
.warn.ok{background:var(--tori-soft);border-left-color:var(--tori)}
.warn.calm{background:var(--card);border-left-color:var(--paddy);border:1px solid var(--line);border-left:7px solid var(--paddy)}
.warn-kicker{font-size:13px;font-weight:600;color:var(--alert);margin-bottom:4px}
.warn.ok .warn-kicker{color:#8A6A00}
.warn.calm .warn-kicker{color:var(--paddy)}
.warn-line{font-size:23px;font-weight:800;line-height:1.28;letter-spacing:-.015em}
.warn-sub{font-size:15px;color:var(--ink-2);margin-top:7px;max-width:44ch}
.warn-src{font-size:12px;color:var(--ink-3);margin-top:10px}
.speak{
  margin-top:12px;display:inline-flex;align-items:center;gap:7px;
  background:var(--ink);color:var(--paper);border-radius:99px;padding:8px 15px;
  font-size:14px;font-weight:600;
}

/* ---------- forecast strip ---------- */
.fc{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.fc::-webkit-scrollbar{height:0}
.fcd{
  flex:0 0 76px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:9px 6px;text-align:center;
}
.fcd b{display:block;font-size:13px;font-weight:600;color:var(--ink-2)}
.fcd .ic{font-size:24px;line-height:1.4}
.fcd .t{font-size:15px;font-weight:800}
.fcd .r{font-size:12px;color:var(--ink-3)}
.fcd.wet{background:var(--alert-soft);border-color:#E8BDB1}

/* ---------- price rows ---------- */
.prices{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--card)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .em{font-size:23px;width:28px;text-align:center}
.prow .nm{flex:1;min-width:0}
.prow .nm b{font-weight:600;font-size:16px;display:block}
.prow .nm span{font-size:12.5px;color:var(--ink-3)}
.prow .pr{text-align:right;white-space:nowrap}
.prow .pr b{font-size:20px;font-weight:800;font-feature-settings:"tnum"}
.prow .pr span{display:block;font-size:12px;font-weight:600}
.up{color:var(--paddy)} .down{color:var(--alert)} .flat0{color:var(--ink-3)}

/* ---------- generic ---------- */
.lbl{font-size:13.5px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.pick{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 5px;text-align:center;font-size:13px;font-weight:600;line-height:1.3;
}
.pick .ic{display:block;font-size:26px;line-height:1.25}
.pick[aria-pressed="true"]{border-color:var(--paddy);background:color-mix(in srgb,var(--paddy) 10%,transparent)}
.btn{
  display:block;width:100%;text-align:center;background:var(--paddy);color:#fff;
  border-radius:var(--radius-sm);padding:15px;font-size:17px;font-weight:800;
}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--paddy);border:1.5px solid var(--paddy)}
.btn.tori{background:var(--tori);color:#241C00}
.num{
  display:flex;align-items:center;gap:0;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);overflow:hidden;background:var(--card);
}
.num button{flex:0 0 58px;padding:14px 0;font-size:24px;font-weight:800;color:var(--paddy)}
.num input{
  flex:1;border:0;text-align:center;font:800 24px "Mukta",sans-serif;
  background:transparent;color:var(--ink);min-width:0;padding:12px 0;
}
select{
  width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--card);color:var(--ink);font:600 16px "Mukta",sans-serif;
}

/* ---------- advisory result ---------- */
.rec{border:1px solid var(--line);border-left:7px solid var(--paddy);border-radius:var(--radius-lg);background:var(--card);padding:15px;position:relative}
.rec.b{border-left-color:var(--tori)} .rec.c{border-left-color:var(--soil)}
.rec h3{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.rec h3 span{font-size:26px}
.rec .why{font-size:15px;color:var(--ink-2);margin:7px 0 11px;max-width:46ch}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.facts div{background:var(--card);padding:9px 11px}
.facts b{display:block;font-size:12px;font-weight:600;color:var(--ink-3)}
.facts i{font-style:normal;font-size:15px;font-weight:600}
.note{font-size:13.5px;color:var(--soil);margin-top:10px;display:flex;gap:7px}

/* ---------- offers / lots ---------- */
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .em{font-size:27px}
.item .bd{flex:1;min-width:0}
.item .bd b{font-size:16.5px;font-weight:600}
.item .bd p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:6px}
.t-wait{background:var(--tori-soft);color:#8A6A00}
.t-ok{background:color-mix(in srgb,var(--paddy) 15%,transparent);color:var(--paddy)}
.t-paid{background:var(--ink);color:var(--paper)}
.money{font-weight:800;font-size:17px;white-space:nowrap;font-feature-settings:"tnum"}

.empty{text-align:center;padding:38px 20px;color:var(--ink-2)}
.empty .ic{font-size:42px;display:block;margin-bottom:10px}
.empty b{display:block;font-size:17px;margin-bottom:5px;color:var(--ink)}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px}
.kpi b{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi i{font-style:normal;font-size:25px;font-weight:800;font-feature-settings:"tnum"}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;bottom:0;width:100%;max-width:var(--shell);background:var(--card);
  border-top:1px solid var(--line);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  z-index:20;
}
.nav button{flex:1;text-align:center;padding:5px 2px;color:var(--ink-3);font-size:11.5px;font-weight:600;line-height:1.3}
.nav button .ic{display:block;font-size:23px;line-height:1.3}
.nav button[aria-current="page"]{color:var(--paddy)}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:99px;
  font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.22s;z-index:40;
  max-width:92%;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.demo{font-size:12px;color:var(--ink-3);text-align:center;padding:18px 10px 4px;line-height:1.5}
.divider{height:1px;background:var(--line);margin:18px 0}
.sms{background:var(--ink);color:var(--paper);border-radius:var(--radius-sm);padding:13px 15px;font-size:14px;line-height:1.55}
.sms b{display:block;font-size:12px;opacity:.6;font-weight:600;margin-bottom:5px}

/* ---------- land scan ---------- */
.modeToggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.modeToggle button{flex:1;text-align:center;padding:9px 4px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink-2)}
.modeToggle button[aria-pressed="true"]{background:var(--paddy);color:#fff}
.scanBox{border:2px dashed var(--line);border-radius:var(--radius-lg);padding:22px 16px;text-align:center;background:var(--card)}
.scanBox .ic{font-size:38px;display:block;margin-bottom:8px}
.camBtn{display:inline-flex;align-items:center;gap:8px;background:var(--paddy);color:#fff;border-radius:99px;padding:11px 20px;font-size:15px;font-weight:700;margin-top:10px}
.photoPreview{width:100%;max-height:220px;object-fit:cover;border-radius:var(--radius-sm);display:block;margin-bottom:12px}
.qopt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;font-size:15px;font-weight:600;margin-bottom:8px}
.qopt[aria-pressed="true"]{border-color:var(--paddy);background:color-mix(in srgb,var(--paddy) 10%,transparent)}
.confBadge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px}
.confGood{background:color-mix(in srgb,var(--paddy) 15%,transparent);color:var(--paddy)}
.confOk{background:var(--tori-soft);color:#8A6A00}
.swatch{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.15)}
.scanDisclaimer{font-size:13px;color:var(--soil);background:color-mix(in srgb,var(--soil) 8%,transparent);border-radius:var(--radius-sm);padding:10px 13px;margin-top:10px;line-height:1.5}
.stepdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.stepdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.stepdots span[aria-current="true"]{background:var(--paddy);width:20px;border-radius:99px}

/* ---------- AI Sahayak (assistant) ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(88px + env(safe-area-inset-bottom, 0px));
  width:56px; height:56px; border-radius:50%; background:var(--paddy); color:#fff;
  font-size:25px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.28); z-index:35;
}
.fabBadge{
  position:absolute; top:-1px; right:-1px; width:14px; height:14px; border-radius:50%;
  background:var(--alert); border:2px solid var(--paper);
}
@keyframes chatIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
.chatPanel{
  position:fixed; left:16px; right:16px; margin:0 auto; max-width:calc(var(--shell) - 32px);
  bottom:calc(158px + env(safe-area-inset-bottom, 0px)); max-height:58vh;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:0 14px 34px rgba(0,0,0,.3); display:flex; flex-direction:column; overflow:hidden;
  z-index:36; animation:chatIn .18s ease-out;
}
.chatHeader{
  display:flex; align-items:center; justify-content:space-between; padding:12px 15px;
  background:var(--paddy-deep); color:#F2F7F0; font-weight:700; font-size:15px; flex:0 0 auto;
}
.chatHeader button{color:#F2F7F0; font-size:17px; padding:2px 8px}
.chatMsgs{flex:1 1 auto; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:140px}
.chatRow{display:flex}
.chatRow.user{justify-content:flex-end}
.botBubble{background:var(--paper); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:10px 13px; max-width:85%; font-size:14.5px; line-height:1.5}
.userBubble{background:var(--paddy); color:#fff; border-radius:14px 14px 4px 14px; padding:10px 13px; max-width:85%; font-size:14.5px; line-height:1.5}
.chatChips{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 2px 2px}
.chip{background:var(--card); border:1.3px solid var(--paddy); color:var(--paddy); border-radius:99px; padding:7px 13px; font-size:12.5px; font-weight:700}
.chatInputRow{display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--card); flex:0 0 auto}
#chatInput{flex:1; border:1.5px solid var(--line); border-radius:99px; padding:10px 15px; font:600 14.5px "Mukta",sans-serif; background:var(--paper); color:var(--ink); min-width:0}
#chatSend{background:var(--paddy); color:#fff; width:40px; height:40px; border-radius:50%; font-size:16px; flex:0 0 40px}

/* ---------- Auth Modal & Admin Dashboard ---------- */
.modalOverlay{
  position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:90; padding:16px;
  animation:fadeIn .15s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modalCard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:0 20px 40px rgba(0,0,0,.35); width:100%; max-width:440px; max-height:90vh;
  overflow-y:auto; padding:20px; animation:chatIn .18s ease-out;
}
.modalClose{background:transparent; border:0; font-size:20px; font-weight:700; color:var(--ink-2); cursor:pointer; padding:4px 8px}
.authTabs{display:flex; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:3px}
.authTab{flex:1; padding:8px 12px; border-radius:99px; font-weight:700; font-size:13.5px; text-align:center; color:var(--ink-2); background:transparent; border:0; cursor:pointer}
.authTab.active{background:var(--paddy); color:#fff}
.demoPills{display:flex; flex-direction:column; gap:6px}
.demoPill{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 12px; font-size:13px; cursor:pointer}
.demoPill:hover{border-color:var(--paddy); background:color-mix(in srgb,var(--paddy) 8%,transparent)}
.formInput, .formSelect{width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; font:600 14px "Mukta",sans-serif; background:var(--paper); color:var(--ink)}
.formInput:focus, .formSelect:focus{border-color:var(--paddy); outline:none}
.kpiGrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.kpiCard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 12px; text-align:center}
.kpiIcon{font-size:24px; margin-bottom:4px}
.kpiVal{font-size:20px; font-weight:800}
.kpiLbl{font-size:12px; color:var(--ink-2); font-weight:600; margin-top:2px}
.adminTable{width:100%; border-collapse:collapse; font-size:13px}
.adminTable th{background:var(--paper); text-align:left; padding:10px 12px; font-weight:700; color:var(--ink-2); border-bottom:1px solid var(--line)}
.adminTable td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <svg class="terrace" viewBox="0 0 430 26" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 26 L0 18 Q70 10 140 16 T280 12 T430 19 L430 26 Z" fill="#EFF2EA" opacity=".18"/>
      <path d="M0 26 L0 23 Q80 16 160 21 T310 18 T430 24 L430 26 Z" fill="#EFF2EA" opacity=".3"/>
    </svg>
    <div class="top-row">
      <div class="brand" id="brandBox"></div>
      <div class="top-actions" style="display:flex;gap:6px;align-items:center">
        <button class="chipbtn" id="authBtn" style="font-weight:700">👤 लगइन</button>
        <button class="chipbtn" id="langBtn" aria-pressed="true">नेपाली</button>
      </div>
    </div>
    <div class="roles" role="tablist" id="roles"></div>
  </header>

  <main class="main" id="main"></main>

  <nav class="nav" id="nav"></nav>
  <div id="sahayakRoot"></div>
  <div id="authModalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="scanCanvas" width="40" height="40" style="display:none" aria-hidden="true"></canvas>
  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
</div>

<script>
"use strict";
/* ===================================================================
   किसान बजार — farmer-first prototype
   Data below is illustrative demo data modelled on Nepali conditions.
   In production: DHM bulletins, Kalimati rates, NARC/DoA crop calendars.
   =================================================================== */

}

async function apiSaveLandScan(token, phone, payload){
  // Sends the derived signals from the scan (land_type, confidence,
  // color_key, texture, drainage, had_photo) — never the raw photo.
  // The API stores them, updates the farmer's record, and returns the
  // saved row. A 401 here means the token expired; caller handles that
  // the same as a network error: fall through to local-only.
  const res = await fetch(`${BACKEND.baseUrl}/v1/farmers/${encodeURIComponent(phone)}/land-scan`, {
    method: "POST",
    headers: {"Content-Type":"application/json", "Authorization": `Bearer ${token}`},
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `land-scan save failed (${res.status})`);
  return data;
}

async function apiGetLandScan(token, phone){
  // Fetches the farmer's most recent saved scan so the app can restore
  // S.land from the server after login — same idea as a listings sync.
  // Returns null on 404 (no scan on file) instead of throwing, so the
  // caller can treat "nothing saved" as a normal first-time case.
  const res = await fetch(`${BACKEND.baseUrl}/v1/farmers/${encodeURIComponent(phone)}/land-scan`, {
    headers: {"Authorization": `Bearer ${token}`}
  });
  if(res.status === 404) return null;
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `land-scan fetch failed (${res.status})`);
  return data;
}

    account.lastError = T("सही फोन नम्बर लेख्नुहोस्","Enter a valid phone number");
    render({skipScroll:true}); return;
  }
  account.busy = true; account.lastError = null; render({skipScroll:true});
  try{
    await apiRequestCode(phone);
    account.phone = phone; account.loginStep = "code_sent"; account.codeDraft = "";
    try {
      const devRes = await fetch(`${BACKEND.baseUrl}/v1/dev/latest-code/${phone}`);
      if(devRes.ok){
        const devData = await devRes.json();
        if(devData && devData.code){
          account.codeDraft = devData.code;
          toast(T("परीक्षण कोड: " + devData.code, "Test code: " + devData.code));

    account.lastError = err.message || T("सर्भरमा पुग्न सकिएन","Could not reach the server");
  }
  account.busy = false; render({skipScroll:true});
}

/* ---------- land scan: photo color + touch/drainage quiz -> land type ----------
   Honesty note: a phone photo cannot measure soil pH, nutrients, or texture —
   that needs a lab or a trained hand. What a photo CAN reasonably suggest is
   surface colour (a real, if rough, indicator soil scientists do use as one
   signal among several — dark soils often carry more organic matter, red
   soils often mean laterite/clay-rich subsoil, pale soils often run sandy).
   Combined with two questions a camera can't answer (how it feels, how long
   water stands after rain), this gives a usable guess — not a lab result.
   It always shows a confidence level and always tells the farmer to confirm
   with a local agriculture office before a big decision. */
function rgbToHsl(r, g, b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0, l=(max+min)/2;
  if(max!==min){
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d + (g<b?6:0); break;
      case g: h=(b-r)/d + 2; break;
      case b: h=(r-g)/d + 4; break;
    }
    h *= 60;
  }
  return {h, s, l};
}

// HSL-based, not raw RGB — tested against ordinary brown loam, which
// naive R>G+k / R>B+k channel comparisons misclassify as "red" far too
// easily (a plain brown soil satisfies "R somewhat greater than G and B"
// even with no real reddish saturation). Hue+saturation together is what
// actually distinguishes a reddish/laterite soil from an ordinary brown one.
function classifySoilColor(r, g, b){
  const {h, s, l} = rgbToHsl(r, g, b);
  if (l < 0.28) return "dark";
  if (l > 0.70 && s < 0.40) return "pale";
  if ((h <= 30 || h >= 345) && s > 0.32 && l < 0.65) return "red";
  return "mixed";
}

const SOIL_COLOR_INFO = {
  dark:  {swatch:"#4A3A28", ne:"गाढा/कालो माटो",  en:"Dark soil",   noteNe:"प्रायः धेरै जैविक पदार्थ हुन्छ, उर्वरा हुन सक्छ।", noteEn:"Often carries more organic matter — can be fertile."},

  pale:  {swatch:"#D8C9A3", ne:"हल्का/पहेंलो माटो", en:"Pale soil",   noteNe:"प्रायः बालुवा बढी हुन्छ, पानी चाँडै सुक्छ।", noteEn:"Often sandier — water drains away quickly."},
  mixed: {swatch:"#8A7A5C", ne:"मिश्रित माटो",      en:"Mixed soil",  noteNe:"रङले प्रस्ट देखिएन — दोमट हुन सक्छ।", noteEn:"No strong colour signal — could be a balanced loam."}
};

// Which answers are considered consistent with each land-type outcome —
// used only to score confidence, not to pick the outcome (the if/else
// chain below does that). Kept as an explicit table rather than ad hoc
// per-branch conditions: the first version of this function had a bug
// where the "khet" confidence check could structurally never reach
// "good" (it only ever re-tested the condition that already produced
// "khet"), while "pakho" could hit "good" even when the texture answer
// actively contradicted it. Testing this in isolation caught both.
const LAND_TYPE_SUPPORT = {
  khet:    {drainage:["khet"],            texture:["clay","mixed"],  colorKey:["dark","mixed"]},
  balaute: {drainage:["fast"],            texture:["sandy"],         colorKey:["pale"]},
  pakho:   {drainage:["fast","sometimes"],texture:["sandy","mixed"], colorKey:["red"]},
  bari:    {drainage:["sometimes","fast"],texture:["mixed","clay"],  colorKey:["dark","mixed","red"]}
};

function combineLandType(colorKey, texture, drainage){
  // texture: "clay" | "sandy" | "mixed"   drainage: "khet" | "fast" | "sometimes"
  let code;
  if (drainage === "khet") code = "khet";
  else if (texture === "sandy" || colorKey === "pale") code = "balaute";
  else if (colorKey === "red" && drainage === "fast") code = "pakho";
  else code = "bari";

  const sup = LAND_TYPE_SUPPORT[code];
  let agree = 0, total = 0;
  if (drainage) { total++; if (sup.drainage.includes(drainage)) agree++; }
  if (texture)  { total++; if (sup.texture.includes(texture)) agree++; }
  if (colorKey) { total++; if (sup.colorKey.includes(colorKey)) agree++; }

  let confidence = (total >= 2 && agree === total) ? "good" : "ok";
  // both answers being the "not sure" options is genuinely low information,
  // even when that happens to match the fallback code's broad support list
  if (texture === "mixed" && drainage === "sometimes") confidence = "ok";

  return {code, confidence};
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("on"),2400);
}

function speak(text){
  try{
    if(!("speechSynthesis" in window)){ toast(T("यो फोनमा बोल्ने सुविधा छैन","Speech not available here")); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang = L==="ne" ? "ne-NP" : "en-US"; u.rate=.92;
    speechSynthesis.speak(u);
    toast(T("सुन्नुहोस्…","Reading aloud…"));
  }catch(e){ toast(T("बोल्न सकिएन","Could not read aloud")); }
}

function offerRow(o){
  const c=CROPS[o.crop];
  const st = o.status==="paid" ? ["t-paid", T("भुक्तानी भयो","Paid")]
           : o.status==="lot"  ? ["t-ok",   T("लटमा मिलियो · "+o.lot, "Pooled into "+o.lot)]
                               : ["t-wait", T("सहकारीको जवाफ पर्खंदै","Waiting on co-op")];
  // o.synced is only ever set on offers created through the real backend
  // integration (see handlePostBtn) — undefined for every pre-existing
  // demo offer and for anything created while BACKEND.enabled is false,
  // so this renders nothing extra in the default/disabled state.
  const syncBadge = o.synced === true ? `<span class="tag t-ok" style="margin-left:5px">${esc(T("सर्भरमा ✓","synced ✓"))}</span>`
                   : o.synced === false ? `<span class="tag t-wait" style="margin-left:5px">${esc(T("स्थानीय मात्र","local only"))}</span>`
                   : "";
  return `<div class="item"><div class="em" aria-hidden="true">${c.ic}</div>
    <div class="bd"><b>${esc(T(c.ne,c.en))} · ${esc(N(o.kg))} ${esc(T("के.जी.","kg"))}</b>
      <p>${esc(T("श्रेणी","Grade"))} ${esc(o.grade)} · ${esc(T(o.day,o.day))}</p>
      <span class="tag ${st[0]}">${esc(st[1])}</span>${syncBadge}</div>
    <div class="money">${esc(money(o.kg*o.rate))}</div></div>`;
}

function findCropInText(lowerText){
  for(const code of Object.keys(CROPS)){
    const c = CROPS[code];
    if(lowerText.includes(c.ne) || lowerText.includes(c.en.toLowerCase())) return code;
  }
  for(const code of Object.keys(CROP_ALIASES)){
    for(const a of CROP_ALIASES[code]) if(lowerText.includes(a)) return code;
  }
  return null;
}

  plant:   ["लगाउने","रोप्ने","के लगाउं","खेती","रोप्न","kheti","lagaune","ropne","plant","grow"],
  ledger:  ["हिसाब","पैसा आयो","भुक्तानी","payment","paisa","hisab","ledger"],
  scan:    ["जग्गा जाँच","माटो जाँच","land scan","माटो"],
  greet:   ["नमस्ते","namaste","hello","hi","हेलो"],
  help:    ["सहयोग","मद्दत","help","madad"]
};

function scoreIntent(lowerText){
  let best = null, bestScore = 0;
  for(const intent of Object.keys(INTENT_KEYWORDS)){
    let score = 0;
    for(const kw of INTENT_KEYWORDS[intent]) if(lowerText.includes(kw)) score++;
    if(score > bestScore){ bestScore = score; best = intent; }
  }
  return bestScore > 0 ? best : null;
}

function defaultChips(){
  return [
    T("आजको मौसम?","Today's weather?"),
    T("धानको भाउ?","Paddy price?"),
    T("के लगाउने?","What to plant?"),
    T("कसरी बेच्ने?","How to sell?")
  ];
}

function assistantReply(rawText){
  const text = (rawText || "").trim();
  const lower = text.toLowerCase();
  if(!text){
    return { text: T("के सोध्नुभयो, बुझिन। फेरि लेख्नुहोस्।","I didn't catch that — try typing again."), chips: defaultChips() };
  }

  const crop = findCropInText(lower);
  const intent = scoreIntent(lower);

  // A bare crop name (no other recognized verb) is almost always a price
  // question — this check runs before the generic intent switch so
  // "गोलभेँडा?" alone still gets a real answer instead of falling through
  // to the fallback just because it didn't literally contain "भाउ".
  if(crop && (intent === "price" || intent === null)){
    const c = CROPS[crop];
    const dir = c.chg > 0 ? T("बढेको","up") : c.chg < 0 ? T("घटेको","down") : T("उस्तै","unchanged");
    return {
      text: T(`${c.ne}: प्रति के.जी. ${money(c.rate)} (हिजोभन्दा ${dir})`,
              `${c.en}: ${money(c.rate)} per kg (${dir} from yesterday)`),
      chips: [T("अर्को बालीको भाउ","Another crop's rate"), T("यो बेच्न चाहन्छु","I want to sell this")]
    };
  }

  if(intent === "weather"){
    const w = WEATHER[S.zone];
    return { text: T(w.ne, w.en), chips: [T("आजको भाउ पनि हेर्ने","See today's rates too")] };
  }

  if(intent === "sell"){
    return {
      text: T(
        "बेच्ने ट्याबमा गएर बाली, तौल र श्रेणी छान्नुहोस्, अनि 'सहकारीमा पठाउनुहोस्' थिच्नुहोस्। सहकारीले लट बनाएपछि SMS आउँछ।",
        "Go to the Sell tab, pick your crop, weight and grade, then tap 'Send to my co-op'. You'll get an SMS once the co-op forms a lot."),
      chips: [T("धन्यवाद","Thanks")]
    };
  }

  if(intent === "plant"){
    const recs = RULES.filter(r => r.zones.includes(S.zone) && r.lands.includes(S.land) && r.sow.includes(BS_NOW));
    if(recs.length){
      const names = recs.slice(0,2).map(r => T(CROPS[r.crop].ne, CROPS[r.crop].en)).join(T(" वा "," or "));
      return {
        text: T(`तपाईंको जग्गामा अहिले ${names} लगाउन मिल्छ। थप विवरणको लागि सल्लाह ट्याब हेर्नुहोस्।`,
                `${names} suits your land right now. See the Advice tab for details.`),
        chips: [T("धन्यवाद","Thanks")]
      };
    }
    return {
      text: T("यो महिना तपाईंको जग्गा र क्षेत्रमा मुख्य बाली सुझाव छैन। माटो सुधार्ने राम्रो समय हो।",
              "No main crop is suggested for your land and area this month — a good time to improve the soil instead."),
      chips: [T("जग्गा फेरि जाँच्ने","Scan my land again")]
    };
  }

  if(intent === "ledger"){
    const due = S.offers.filter(o => o.status !== "paid").reduce((a,o) => a + o.kg*o.rate, 0);
    if(due > 0){
      return {
        text: T(`तपाईंलाई ${money(due)} आउन बाँकी छ। भुक्तानी सामान्यतया तौलिएको ४८ घण्टाभित्र आउँछ।`,
                `You have ${money(due)} still to come. Payment usually arrives within 48 hours of weighing.`),
        chips: [T("धन्यवाद","Thanks")]
      };
    }
    return { text: T("अहिले तपाईंको कुनै भुक्तानी बाँकी छैन।","You have no pending payments right now."),
             chips: [T("बेच्न सुरु गर्ने","Start selling")] };
  }

  if(intent === "scan"){
    return {
      text: T("सल्लाह ट्याबमा गएर '📷 फोटोबाट जाँच्नुहोस्' थिच्नुहोस् — माटोको फोटो र दुई प्रश्नबाट जग्गाको किसिम अनुमान गर्छ।",
              "Go to the Advice tab and tap 'Scan by photo' — it estimates your land type from a soil photo and two questions."),
      chips: [T("धन्यवाद","Thanks")]
    };
  }

  if(intent === "greet"){
    return { text: T("नमस्ते! म तपाईंलाई भाउ, मौसम, बेच्ने वा के लगाउने भन्ने कुरामा मद्दत गर्न सक्छु।",
                      "Hello! I can help with rates, weather, selling, or what to plant."), chips: defaultChips() };
  }

  if(intent === "help"){
    return { text: T("तल कुनै एउटा थिच्नुहोस्, वा आफ्नै शब्दमा सोध्नुहोस्।","Tap one below, or ask in your own words."), chips: defaultChips() };
  }

  return {
    text: T("मैले ठ्याक्कै बुझिन। यी मध्ये सोध्न सक्नुहुन्छ, वा सहकारीलाई सिधै फोन गर्नुहोस्।",
            "I didn't quite understand. You can ask one of these, or call your co-op directly."),
    chips: defaultChips()
  };
}

function ensureGreeting(){
  if(chat.messages.length === 0){
    const g = assistantReply(T("नमस्ते","hello"));
    chat.messages.push({from:"bot", text:g.text, chips:g.chips});
  }
}

function sendChatMessage(text){
  text = (text || "").trim();
  if(!text) return;
  chat.messages.push({from:"user", text});
  const reply = assistantReply(text);
  chat.messages.push({from:"bot", text:reply.text, chips:reply.chips});
  render({skipScroll:true});
  try{
    const box = $("chatMsgs"); if(box) box.scrollTop = box.scrollHeight;
    const inp = $("chatInput"); if(inp){ inp.value = ""; inp.focus(); }
  }catch(e){ /* best-effort UI polish only */ }
}

  }

  if (scan.step === "texture"){
    const opts = [
      ["clay",  "टाँसिने · च्याप्दा डल्लो बन्छ",     "Sticky · forms a ball when squeezed"],

      ["fast",      "चाँडै सुक्छ (छिनभित्रै)",          "Drains away fast (within minutes)"],
      ["sometimes", "बेलाबेला मात्र जम्छ",              "Only sometimes"]

      <div style="font-weight:700;font-size:16px;margin-bottom:12px">${esc(T("पानी परेपछि जमिनमा पानी कति बेर बस्छ?","After rain, how long does water sit on the ground?"))}</div>

      </div>
    </div>`;
  }

  return "";
}

function viewAdvice(){

    <span class="ic" aria-hidden="true">${l.ic}</span>${esc(T(l.ne,l.en))}</button>`).join("");

  // While a scan is in progress (photo/questions not yet finished), there's
  // no land type to base a recommendation on — show a placeholder instead of
  // stale results from whatever S.land was set to before. Once scan.result
  // exists, preview recs against it immediately, before the farmer even taps
  // "Use this" — confirming just persists the choice for next time.
  const effectiveLand = (scan.mode==="scan" && scan.result) ? scan.result.code : S.land;
  const scanPending = scan.mode==="scan" && !scan.result;
  const recs = scanPending ? [] : RULES.filter(r=> r.zones.includes(S.zone) && r.lands.includes(effectiveLand) && r.sow.includes(BS_NOW));
  const soon = scanPending ? [] : RULES.filter(r=> r.zones.includes(S.zone) && r.lands.includes(effectiveLand)
                 && !r.sow.includes(BS_NOW) && r.sow.includes((BS_NOW+1)%12));

  const card = (r,i)=>{
    const c=CROPS[r.crop];
    const harvest = r.days ? BS_MONTHS[(BS_NOW + Math.round(r.days/30))%12] : null;
    const harvestEn = r.days ? BS_EN[(BS_NOW + Math.round(r.days/30))%12] : null;
    const why = T(r.why[0], r.why[1]);
    const note = T(r.note[0], r.note[1]);
    return `<div class="rec ${["","b","c"][i%3]}">
      <h3><span aria-hidden="true">${c.ic}</span>${esc(T(c.ne,c.en))}</h3>
      <p class="why">${esc(why)}</p>
      <div class="facts">
        <div><b>${esc(T("छर्ने/रोप्ने","Sow / plant"))}</b><i>${esc(T(BS_MONTHS[BS_NOW],BS_EN[BS_NOW]))}</i></div>
        <div><b>${esc(T("काट्ने अनुमान","Harvest around"))}</b><i>${r.days?esc(T(harvest,harvestEn)):esc(T("बहुवर्षे","Perennial"))}</i></div>

function renderAccountPanel(){
  // Nothing renders here at all while BACKEND.enabled is false — the
  // default, published state, where there is genuinely no reachable
  // server for a login UI to connect to. Showing a non-functional login
  // form would be worse than showing nothing.
  if(!BACKEND.enabled) return "";

  let body;
  if(account.token){
    body = `<div class="item" style="border:0;padding:0">
        <div class="em">✅</div>
        <div class="bd"><b>${esc(T("जोडिएको","Connected"))} · ${esc(account.phone)}</b>
          <p>${esc(T("तपाईंको लिस्टिङ सिधै वास्तविक सर्भरमा जान्छ।","Your listings go straight to the real server."))}</p></div>
      </div>
      <button class="btn ghost" id="logoutBtn" style="margin-top:10px">${esc(T("लगआउट","Log out"))}</button>`;
  } else if(account.loginStep === "code_sent"){
    body = `<div class="lbl">${esc(T("कोड पठाइयो — यहाँ लेख्नुहोस्","Code sent — enter it here"))}</div>
      <div class="num" style="margin-bottom:10px">
        <input id="codeInput" inputmode="numeric" maxlength="6" placeholder="000000" value="${esc(account.codeDraft)}">
      </div>
      <button class="btn" id="verifyCodeBtn" ${account.busy?"disabled":""}>${account.busy?esc(T("जाँच हुँदैछ...","Checking...")):esc(T("प्रमाणित गर्नुहोस्","Verify"))}</button>`;
  } else {
    body = `<div class="lbl">${esc(T("फोन नम्बर","Phone number"))}</div>
      <div class="num" style="margin-bottom:10px">
        <input id="phoneInput" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX" value="${esc(account.phone)}">
      </div>
      <button class="btn" id="requestCodeBtn" ${account.busy?"disabled":""}>${account.busy?esc(T("पठाउँदै...","Sending...")):esc(T("कोड पठाउनुहोस्","Send code"))}</button>`;
  }
  const err = account.lastError ? `<div class="scanDisclaimer" style="margin-top:10px">⚠️ ${esc(account.lastError)}</div>` : "";
  return `<h2 class="sec">${esc(T("वास्तविक सर्भरमा जोड्नुहोस्","Connect to the real server"))}</h2>
    <div class="card">${body}${err}</div>`;
}

                market:viewMarket, cart:viewCart, how:viewHow,
                pool:viewPool, route:viewRoute, board:viewBoard};

function render(opts){
  opts = opts || {};
  document.documentElement.lang = L==="ne" ? "ne" : "en";
  if(!TABS[S.role].some(t=>t[0]===S.tab)) S.tab = TABS[S.role][0][0];
  header(); nav();
  $("main").innerHTML = (VIEWS[S.tab]||viewToday)();
  $("sahayakRoot").innerHTML = renderSahayak();
  // chat interactions re-render too (new message, opening the panel) but
  // must NOT jump the whole page back to top the way a tab switch should —
  // callers that only touch chat state pass skipScroll.
  if(!opts.skipScroll) window.scrollTo(0,0);
  save();
}

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button");
  if(!t) return;

  if(t.id==="langBtn"){ L = L==="ne"?"en":"ne"; store.set("lang",L); render(); return; }
  if(t.dataset.role){ S.role=t.dataset.role; S.tab=TABS[S.role][0][0]; render(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.speak!==undefined){ speak(t.dataset.speak); return; }

  if(t.id==="sahayakFab"){
    chat.open = !chat.open;
    if(chat.open && !sahayakSeen){ sahayakSeen = true; store.set("sahayakSeen", true); }
    render({skipScroll:true});
    try{ const inp=$("chatInput"); if(inp) inp.focus(); }catch(e){}
    return;
  }
  if(t.id==="sahayakClose"){ chat.open=false; render({skipScroll:true}); return; }
  if(t.dataset.chip){ sendChatMessage(t.dataset.chip); return; }
  if(t.id==="chatSend"){ const inp=$("chatInput"); sendChatMessage(inp?inp.value:""); return; }

  if(t.dataset.crop){ sell.crop = sell.crop===t.dataset.crop ? null : t.dataset.crop; render(); return; }
  if(t.dataset.kg){ sell.kg = Math.max(5, Math.min(2000, sell.kg + +t.dataset.kg)); render(); return; }
  if(t.dataset.grade){ sell.grade=t.dataset.grade; render(); return; }

  if(t.id==="postBtn" && sell.crop && !sell.posting){ handlePostBtn(); return; }

  if(t.id==="requestCodeBtn" && !account.busy){
    const inp = $("phoneInput");
    doRequestCode(inp ? inp.value.trim() : "");
    return;
  }
  if(t.id==="verifyCodeBtn" && !account.busy){
    const inp = $("codeInput");
    doVerifyCode(inp ? inp.value.trim() : "");
    return;
  }
  if(t.id==="logoutBtn"){
    account = {phone:"", token:null, loginStep:"idle", codeDraft:"", busy:false, lastError:null};
    saveAccount(); render({skipScroll:true});
    toast(T("लगआउट भयो","Logged out")); return;
  }
  if(t.id==="toggleBackendBtn"){
    BACKEND.enabled = !BACKEND.enabled;
    store.set("backendEnabled", BACKEND.enabled);
    render({skipScroll:true});
    toast(BACKEND.enabled ? T("सर्भर सक्षम गरियो","API backend enabled") : T("स्थानीय मोड","Local-only mode"));
    return;
  }

  if(t.dataset.zone){ S.zone=t.dataset.zone; render(); return; }
  if(t.dataset.land){ S.land=t.dataset.land; render(); return; }

  if(t.dataset.scanmode){
    scan.mode = t.dataset.scanmode;
    if(scan.mode==="scan"){ scan.step="intro"; scan.photoDataUrl=null; scan.colorKey=null; scan.texture=null; scan.drainage=null; scan.result=null; scan.synced=null; }
    render(); return;
  }
  if(t.id==="scanCapture"){ $("photoInput").click(); return; }
  if(t.id==="scanNext"){ scan.step="texture"; render(); return; }
  if(t.id==="scanSkipPhoto"){ scan.colorKey=null; scan.step="texture"; render(); return; }
  if(t.dataset.texture){ scan.texture=t.dataset.texture; scan.step="drainage"; render(); return; }
  if(t.dataset.drainage){
    scan.drainage=t.dataset.drainage;
    scan.result = combineLandType(scan.colorKey || "mixed", scan.texture, scan.drainage);
    scan.step="result"; scan.synced=null; render(); return;
  }
  if(t.id==="scanUseResult" && scan.result){
    S.land = scan.result.code;
    // Mirror the listing-post pattern: attempt to save to the real API
    // when connected, fall back to local-only without blocking the UI.
    if(BACKEND.enabled && account.token){
      (async()=>{
        try{
          await apiSaveLandScan(account.token, account.phone, {
            land_type:  scan.result.code,
            confidence: scan.result.confidence,
            color_key:  scan.colorKey  || null,
            texture:    scan.texture   || null,
            drainage:   scan.drainage  || null,
            had_photo:  !!scan.photoDataUrl
          });
          scan.synced = true;
        }catch(_e){
          scan.synced = false;
        }
        render({skipScroll:true});
        toast(scan.synced
          ? T("जग्गाको जाँच सर्भरमा सेभ भयो","Land scan saved to server")
          : T("जग्गाको किसिम सेट भयो (स्थानीय मात्र)","Land type set (local only)"));
      })();
    } else {
      scan.synced = null;
      toast(T("जग्गाको किसिम सेट भयो","Land type set"));
    }
    scan.mode="manual"; render(); return;
  }
  if(t.id==="scanRedo"){
    scan.step="intro"; scan.photoDataUrl=null; scan.colorKey=null; scan.texture=null; scan.drainage=null; scan.result=null; scan.synced=null;
    render(); return;
  }

  if(t.dataset.lot){
    const id=t.dataset.lot, l=LOTS.find(x=>x.id===id);
    S.cart[id]=Math.max(0, Math.min(l.kg, (S.cart[id]||0) + (+t.dataset.d)));
    render(); return;
  }
  if(t.id==="orderBtn"){ S.cart={}; S.tab="market"; render(); toast(T("अर्डर पक्का भयो","Order confirmed")); return; }
  if(t.id==="lotBtn"){ toast(T("लट KVR-११९ बन्यो · ४ किसान","Lot KVR-119 formed · 4 farmers")); return; }
  if(t.id==="resetBtn"){
    S.offers=[]; S.cart={}; render(); toast(T("मेटियो","Cleared")); return;
  }
});

document.addEventListener("keydown", e=>{
  if(e.target && e.target.id==="chatInput" && e.key==="Enter"){
    e.preventDefault();
    sendChatMessage(e.target.value);
  }
  if(e.target && e.target.id==="phoneInput" && e.key==="Enter" && !account.busy){
    e.preventDefault();
    doRequestCode(e.target.value.trim());
  }
  if(e.target && e.target.id==="codeInput" && e.key==="Enter" && !account.busy){
    e.preventDefault();
    doVerifyCode(e.target.value.trim());
  }
});

document.addEventListener("change", e=>{
  if(e.target.id==="zoneSel"){ S.zone=e.target.value; render(); }

  if(e.target.id==="photoInput"){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const canvas = $("scanCanvas");
          const ctx = canvas.getContext("2d");
          // downscale to 40x40 before sampling — we only need an average
          // colour signal, not full resolution, and this keeps it fast
          // even on a low-end phone.
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          let r=0,g=0,b=0,n=0;
          for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
          r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
          scan.colorKey = classifySoilColor(r,g,b);
        }catch(err){
          scan.colorKey = null; // canvas analysis failed — proceed without it rather than block the flow
        }
        scan.photoDataUrl = ev.target.result;
        render();
      };
      img.onerror = ()=>{ toast(T("फोटो पढ्न सकिएन","Could not read photo")); };
      img.src = ev.target.result;
    };
    reader.onerror = ()=>{ toast(T("फोटो पढ्न सकिएन","Could not read photo")); };
    reader.readAsDataURL(file);
    e.target.value = ""; // allow re-selecting the same file for "retake"
  }
});

render();
</script>
</body>
</html>
