services:
  - type: web
    name: kisan-bazar
    runtime: python
    buildCommand: pip install -r kisan-bazar-api/requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /v1/health
    envVars:
      - key: KISAN_BAZAR_SECRET
        generateValue: true
      - key: KISAN_BAZAR_DEMO_MODE
        value: "1"
      - key: KISAN_BAZAR_ALLOWED_ORIGINS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
