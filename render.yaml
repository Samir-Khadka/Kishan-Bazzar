services:
  - type: web
    name: kisan-bazar
    runtime: python
    buildCommand: pip install -r kisan-bazar-api/requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /v1/health
    envVars:
      - key: KISAN_BAZAR_SECRET
        generateValue: true
      - key: KISAN_BAZAR_DEMO_MODE
        value: "1"
      - key: KISAN_BAZAR_ALLOWED_ORIGINS
        value: ""
      # Optional real-SMS delivery via the Messaging API
      # (github.com/Samir-Khadka/messaging-api). Leave empty to keep
      # the demo mock-SMS behaviour; set both to send real OTP texts.
      - key: KISAN_MESSAGING_API_URL
        value: ""
      - key: KISAN_MESSAGING_API_KEY
        value: ""
      - key: KISAN_MESSAGING_CHANNEL
        value: "sms"
      - key: PYTHON_VERSION
        value: "3.11.0"
