<script src="site.js"></script>

<script>
let pendingPhone = "";
async function sendOTP(){
  const phone = document.getElementById("login-phone").value.trim();
  const msg = document.getElementById("login-msg");
  if(!/^9[678]\d{8}$/.test(phone)){
    msg.textContent = LANG==="ne" ? "सही १० अंकको मोबाइल नम्बर हाल्नुहोस्" : "Enter a valid 10-digit mobile number";
    return;
  }
  msg.textContent = LANG==="ne" ? "पठाउँदै…" : "Sending…";
  try{
    const r = await fetch(API + "/v1/auth/request-code", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({phone})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || r.status);
    pendingPhone = phone;
    document.getElementById("otp-to").textContent = phone;
    document.getElementById("step-phone").style.display = "none";
    document.getElementById("step-otp").style.display = "block";
    msg.textContent = "";
    // Demo mode: the dev endpoint (404 when demo mode is off) exposes the
    // code, like the app's own login does. request-code never returns it.
    try{
      const devRes = await fetch(API + "/v1/dev/latest-code/" + encodeURIComponent(phone));
      if(devRes.ok){
        const devData = await devRes.json();
        if(devData && devData.code){
          msg.textContent = (LANG==="ne" ? "डेमो कोड: " : "Demo code: ") + devData.code;
        }
      }
    }catch(_e){}
    document.getElementById("login-otp").focus();
  }catch(e){
    msg.textContent = LANG==="ne" ? "त्रुटि: " + e.message : "Error: " + e.message;
  }
}
async function verifyOTP(){
  const code = document.getElementById("login-otp").value.trim();
  const msg = document.getElementById("login-msg");
  msg.textContent = LANG==="ne" ? "जाँच्दै…" : "Verifying…";
  try{
    const r = await fetch(API + "/v1/auth/verify", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({phone: pendingPhone, code})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || r.status);
    // Session keys and JSON encoding must match the app's store helper
    // (kisan-bazar.html: store.set/get use "kb:"+key with JSON.stringify),
    // otherwise the app lands logged-out after this redirect.
    localStorage.setItem("kb:accountToken", JSON.stringify(d.token));
    localStorage.setItem("kb:accountPhone", JSON.stringify(pendingPhone));
    window.location.href = "/";
  }catch(e){
    msg.textContent = (LANG==="ne" ? "त्रुटि: " : "Error: ") + e.message;
  }
}
function backToPhone(){
  document.getElementById("step-otp").style.display = "none";
  document.getElementById("step-phone").style.display = "block";
  document.getElementById("login-msg").textContent = "";
}
// Enter submits on both steps
document.getElementById("login-phone").addEventListener("keydown", e=>{ if(e.key==="Enter") sendOTP(); });
document.getElementById("login-otp").addEventListener("keydown", e=>{ if(e.key==="Enter") verifyOTP(); });
</script>
