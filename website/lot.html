<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>लट विवरण — किसान बजार</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-in">
    <a href="index.html" class="logo">🌾 <span>किसान बजार</span> <small>KISAN BAZAR</small></a>
    <nav class="main-nav">
      <a href="index.html" data-ne="होम" data-en="Home">होम</a>
      <a href="market.html" class="active">बजार</a>
      <a href="how.html" data-ne="कसरी काम गर्छ" data-en="How it works">कसरी काम गर्छ</a>
      <a href="about.html" data-ne="हाम्रो बारेमा" data-en="About">हाम्रो बारेमा</a>
      <a href="contact.html" data-ne="सम्पर्क" data-en="Contact">सम्पर्क</a>
    </nav>
    <div class="header-cta">
      <button class="lang-toggle" onclick="toggleLang()">ने / EN</button>
      <a href="/" class="btn-primary" data-ne="एप खोल्नुहोस्" data-en="Open app">एप खोल्नुहोस्</a>
    </div>
    <button class="menu-btn" onclick="document.querySelector('.main-nav').classList.toggle('open')">☰</button>
  </div>
</header>
<main>
  <div class="wrap section" id="lot-detail"><p class="muted">लोड हुँदैछ…</p></div>
</main>
<footer class="site-footer">
  <div class="wrap footer-in">
    <div class="f-col"><b>🌾 किसान बजार</b><p>नेपालका किसानका लागि बनेको डिजिटल बजार।</p></div>
    <div class="f-col"><b>बजार</b><a href="market.html">आजका लटहरू</a><a href="how.html" data-ne="कसरी काम गर्छ" data-en="How it works">कसरी काम गर्छ</a></div>
    <div class="f-col"><b>कम्पनी</b><a href="about.html" data-ne="हाम्रो बारेमा" data-en="About">हाम्रो बारेमा</a><a href="contact.html" data-ne="सम्पर्क" data-en="Contact">सम्पर्क</a></div>
    <div class="f-col"><b>कानुनी</b><a href="terms.html">सर्तहरू</a><a href="privacy.html">गोपनीयता</a></div>
  </div>
  <div class="wrap footer-base"><span>© 2026 किसान बजार · Kisan Bazar</span><span>उर्लाबारी, नेपाल</span></div>
</footer>
<script src="site.js"></script>
<script>
(async ()=>{
  const id = new URLSearchParams(location.search).get("id");
  const box = document.getElementById("lot-detail");
  if(!id){ box.innerHTML = "<p>लट भेटिएन।</p>"; return; }
  try{
    const lots = await (await fetch("/v1/lots")).json();
    const l = (lots||[]).find(x=>String(x.id)===String(id));
    if(!l){ box.innerHTML = "<p>लट भेटिएन।</p>"; return; }
    const ne = (localStorage.getItem("kb-lang")||"ne")==="ne";
    const name = ne ? (CROP_NE[l.crop_code]||l.crop_code) : (CROP_EN[l.crop_code]||l.crop_code);
    document.title = `${name} — किसान बजार`;
    box.innerHTML = `
      <p><a href="market.html">← ${ne?"बजार":"Market"}</a></p>
      <div class="card" style="margin-top:16px; display:flex; gap:24px; align-items:center; flex-wrap:wrap">
        <div style="font-size:84px">${CROP_ICON[l.crop_code]||"🌾"}</div>
        <div style="flex:1; min-width:240px">
          <h1 style="font-size:32px; color:var(--paddy-deep)">${name}</h1>
          <p class="muted">${l.pooled_kg} kg ${ne?"उपलब्ध":"available"} · ${ne?"ग्रेड":"Grade"} ${l.grade||"A"}</p>
          <p style="font-size:28px; font-weight:800; color:var(--paddy-deep); margin:12px 0">रू ${l.rate_per_kg||"—"} <small style="font-size:15px; font-weight:600; color:var(--ink-2)">${ne?"प्रति के.जी.":"per kg"}</small></p>
          <a class="btn-primary big" href="/">${ne?"एपमा मोलतोल / अर्डर गर्नुहोस्":"Negotiate / order in the app"}</a>
        </div>
      </div>
      <div class="prose" style="padding-left:0">
        <h2>${ne?"विवरण":"Details"}</h2>
        <ul>
          <li>${ne?"लट कोड":"Lot code"}: <b>${l.id}</b></li>
          <li>${ne?"अवस्था":"Status"}: ${l.status}</li>
          <li>${ne?"सहकारी":"Co-op"}: ${l.coop_id}</li>
        </ul>
      </div>`;
  }catch(e){ box.innerHTML = "<p>लोड हुन सकेन।</p>"; }
})();
</script>
</body>
</html>
